databases:
  - name: threed-store-db
    databaseName: threed_store
    user: threed_store
    plan: free

services:
  - type: web
    name: threed-store-api
    runtime: python
    plan: free
    rootDir: "3D Web Project/backend"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/store/products/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: threed-store-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: threed-store-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: threed-store-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: threed-store-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: threed-store-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        value: "https://threed-store-web.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://threed-store-web.onrender.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: threed-store-web
    runtime: static
    rootDir: "3D Web Project/frontend"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://threed-store-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
